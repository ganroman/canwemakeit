name: canwemakeit

services:
  homepage:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - prototypes
    depends_on:
      homepage:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      - gateway

networks:
  prototypes:
    name: canwemakeit_proxy

volumes:
  caddy_data:
  caddy_config:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
